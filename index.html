<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡Haa Hoang Danh </title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: #0a0a12;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #d4d4d4;
    min-height: 100vh;
    padding: 20px;
    background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000 70%);
}
.container {
    max-width: 1100px; margin: 0 auto;
}
.header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 2px solid #2a2a3a;
    margin-bottom: 30px;
}
.header h1 {
    font-size: 2em;
    background: linear-gradient(90deg, #ff5555, #ffb86c, #f1fa8c, #50fa7b, #8be9fd, #ff79c6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}
.header p { color: #6c6c80; font-size: 0.9em; }

.card {
    background: #12121c;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
}
.card-title {
    font-size: 1.1em;
    color: #ffb86c;
    margin-bottom: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
}
.form-group {
    margin-bottom: 15px;
}
.form-group label {
    display: block;
    color: #8be9fd;
    font-size: 0.85em;
    margin-bottom: 6px;
}
.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    background: #0a0a12;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 10px 12px;
    color: #f1fa8c;
    font-family: inherit;
    font-size: 0.9em;
    outline: none;
    transition: border-color 0.3s;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #50fa7b;
    box-shadow: 0 0 10px rgba(80, 250, 123, 0.2);
}
.form-group textarea {
    min-height: 100px;
    resize: vertical;
}
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
.btn {
    background: #1a1a24;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 12px 20px;
    color: #d4d4d4;
    font-family: inherit;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
}
.btn:hover {
    background: #252536;
    border-color: #50fa7b;
    transform: translateY(-1px);
}
.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.btn-primary {
    background: linear-gradient(135deg, #50fa7b, #8be9fd);
    color: #0a0a12;
    border: none;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(80, 250, 123, 0.4);
}
.btn-danger {
    background: #ff5555;
    color: white;
    border: none;
}
.btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}
.info {
    color: #6c6c80;
    font-size: 0.85em;
    margin-top: 8px;
}
.success { color: #50fa7b; }
.error { color: #ff5555; }
.warning { color: #f1fa8c; }
.loading { color: #ffb86c; }

.status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 0.8em;
    font-weight: bold;
    margin-left: 10px;
}
.status-running { background: rgba(80, 250, 123, 0.2); color: #50fa7b; }
.status-stopped { background: rgba(255, 85, 85, 0.2); color: #ff5555; }

.log {
    background: #0a0a12;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 12px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 0.85em;
    line-height: 1.5;
    margin-top: 15px;
}
.log-entry { margin-bottom: 4px; }
.log-time { color: #6c6c80; }

.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.task-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0a0a12;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 12px 16px;
}
.task-info { flex: 1; }
.task-name { color: #f1fa8c; font-weight: bold; }
.task-meta { color: #6c6c80; font-size: 0.8em; margin-top: 3px; }
.group-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
    margin-top: 10px;
}
.group-item {
    background: #0a0a12;
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9em;
}
.group-item:hover {
    border-color: #50fa7b;
    background: rgba(80, 250, 123, 0.05);
}
.group-item.selected {
    border-color: #50fa7b;
    background: rgba(80, 250, 123, 0.15);
    color: #50fa7b;
}
.hidden { display: none; }

@media (max-width: 768px) {
    .row { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.3em; }
}
</style>
</head>
<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>⚡ Haa Hoang Danh</h1>
        <p>Web Panel - Chạy Bot Zalo Thật 100%</p>
    </div>

    <!-- BƯỚC 1: ĐĂNG NHẬP -->
    <div class="card">
        <div class="card-title">🔐 BƯỚC 1: ĐĂNG NHẬP ZALO</div>
        <div class="form-group">
            <label>IMEI</label>
            <input type="text" id="imei" placeholder="Nhập IMEI Zalo...">
        </div>
        <div class="form-group">
            <label>Cookie (JSON hoặc dict)</label>
            <textarea id="cookie" placeholder='Nhập Cookie dạng {"zpw_sek":"...", "zpw_ver":"..."} hoặc dict Python...'></textarea>
        </div>
        <button class="btn btn-primary" onclick="loginZalo()">🔓 Đăng Nhập</button>
        <div id="loginStatus" class="info"></div>
    </div>

    <!-- BƯỚC 2: CHỌN NHÓM -->
    <div class="card hidden" id="groupsCard">
        <div class="card-title">📋 BƯỚC 2: CHỌN NHÓM</div>
        <div id="profileInfo" class="info" style="margin-bottom: 10px;"></div>
        <div class="group-list" id="groupList"></div>
        <div class="info">💡 Nhấp vào nhóm để chọn</div>
    </div>

    <!-- BƯỚC 3: CHỌN CHỨC NĂNG -->
    <div class="card hidden" id="actionCard">
        <div class="card-title">⚙️ BƯỚC 3: CHỌN CHỨC NĂNG</div>

        <div class="row">
            <div class="form-group">
                <label>Chức năng</label>
                <select id="actionType">
                    <option value="treongon">📝 Treo Ngôn</option>
                    <option value="tag">✨ Nhây Thường</option>
                    <option value="tag_color">🌈 Nhây Màu</option>
                </select>
            </div>
            <div class="form-group">
                <label>Delay (giây)</label>
                <input type="number" id="delay" value="5" min="1">
            </div>
        </div>

        <div class="form-group">
            <label>Nội dung tin nhắn (mỗi dòng = 1 tin)</label>
            <textarea id="messageText" placeholder="Nhập nội dung...&#10;Ví dụ:&#10;Xin chào mọi người!&#10;Chúc ngày mới vui vẻ!"></textarea>
        </div>

        <div class="row" id="extraOptions">
            <div class="form-group">
                <label>Font size (Treo Ngôn)</label>
                <input type="number" id="fontSize" value="40" min="10" max="500">
            </div>
            <div class="form-group">
                <label>Chế độ màu (Treo Ngôn)</label>
                <select id="colorMode">
                    <option value="y">Mỗi dòng 1 màu</option>
                    <option value="n">Cả tin 1 màu</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Đối tượng tag (chỉ Nhây)</label>
            <select id="tagTarget">
                <option value="all">@All (Tất cả thành viên)</option>
                <option value="custom">Chọn thành viên cụ thể</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="startTask()">🚀 Bắt Đầu Task</button>
        <div id="taskStatus" class="info"></div>
    </div>

    <!-- TASKS ĐANG CHẠY -->
    <div class="card" id="tasksCard">
        <div class="card-title">
            📊 TASKS ĐANG CHẠY
            <span class="status status-running" id="taskCount">0</span>
        </div>
        <div class="task-list" id="taskList">
            <div class="info">Chưa có task nào đang chạy.</div>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="refreshTasks()">🔄 Làm mới</button>
            <button class="btn btn-danger" onclick="stopAllTasks()">⛔ Dừng tất cả</button>
        </div>
    </div>

    <!-- LOG -->
    <div class="card">
        <div class="card-title">📜 LOG</div>
        <div class="log" id="logBox"></div>
    </div>

</div>

<script>
// ==================== GLOBAL STATE ====================
const STATE = {
    imei: '',
    cookies: null,
    groups: [],
    selectedGroup: null,
    profile: null,
    API_BASE: '' // Để trống = cùng domain
};

// ==================== LOG ====================
function log(msg, type = 'info') {
    const logBox = document.getElementById('logBox');
    const time = new Date().toTimeString().slice(0, 8);
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
    entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${cls}">${msg}</span>`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(id, msg, type = 'info') {
    const el = document.getElementById(id);
    const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'loading';
    el.className = 'info ' + cls;
    el.textContent = msg;
}

// ==================== API CALLS ====================
async function apiCall(path, method = 'GET', data = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (data) opts.body = JSON.stringify(data);
    const res = await fetch(STATE.API_BASE + path, opts);
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'API Error');
    return json;
}

// ==================== LOGIN ====================
async function loginZalo() {
    const imei = document.getElementById('imei').value.trim();
    const cookieStr = document.getElementById('cookie').value.trim();

    if (!imei || !cookieStr) {
        setStatus('loginStatus', '❌ Vui lòng nhập IMEI và Cookie', 'error');
        return;
    }

    setStatus('loginStatus', '⏳ Đang đăng nhập...', 'loading');
    log('🔄 Đang đăng nhập Zalo...', 'info');

    try {
        const result = await apiCall('/api/login', 'POST', {
            imei: imei,
            cookie: cookieStr
        });

        STATE.imei = imei;
        STATE.cookies = cookieStr;
        STATE.groups = result.groups;
        STATE.profile = result.profile;

        log(`✅ Đăng nhập thành công! Xin chào ${result.profile.name}`, 'success');
        setStatus('loginStatus', `✅ Đăng nhập thành công!`, 'success');

        // Hiển thị danh sách nhóm
        document.getElementById('groupsCard').classList.remove('hidden');
        document.getElementById('actionCard').classList.remove('hidden');
        document.getElementById('profileInfo').innerHTML = `
            👤 <strong>${result.profile.name}</strong> 
            • UID: ${result.profile.uid} 
            • 📱 ${result.profile.phone}
            • 📦 ${result.groups.length} nhóm
        `;

        renderGroups(result.groups);
    } catch (err) {
        setStatus('loginStatus', `❌ ${err.message}`, 'error');
        log(`❌ Lỗi đăng nhập: ${err.message}`, 'error');
    }
}

function renderGroups(groups) {
    const box = document.getElementById('groupList');
    box.innerHTML = '';
    groups.forEach(g => {
        const div = document.createElement('div');
        div.className = 'group-item';
        div.textContent = '📦 ' + g.name;
        div.onclick = () => selectGroup(g, div);
        box.appendChild(div);
    });
}

function selectGroup(group, el) {
    document.querySelectorAll('.group-item').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    STATE.selectedGroup = group;
    log(`📌 Đã chọn nhóm: ${group.name}`, 'info');
}

// ==================== START TASK ====================
async function startTask() {
    if (!STATE.imei) {
        alert('Vui lòng đăng nhập trước!');
        return;
    }
    if (!STATE.selectedGroup) {
        alert('Vui lòng chọn nhóm!');
        return;
    }
    const messageText = document.getElementById('messageText').value.trim();
    if (!messageText) {
        alert('Vui lòng nhập nội dung!');
        return;
    }

    const type = document.getElementById('actionType').value;
    const delay = parseFloat(document.getElementById('delay').value);
    const group = STATE.selectedGroup;

    setStatus('taskStatus', '⏳ Đang khởi động task...', 'loading');

    try {
        let endpoint, payload;
        if (type === 'treongon') {
            endpoint = '/api/start/treongon';
            payload = {
                imei: STATE.imei,
                cookies: STATE.cookies,
                group_id: group.id,
                group_name: group.name,
                message_text: messageText,
                delay: delay,
                font_size: parseInt(document.getElementById('fontSize').value),
                color_mode: document.getElementById('colorMode').value,
                task_name: `Treo Ngôn - ${group.name.slice(0, 20)}`
            };
        } else {
            endpoint = '/api/start/tag';
            payload = {
                imei: STATE.imei,
                cookies: STATE.cookies,
                group_id: group.id,
                group_name: group.name,
                message_text: messageText,
                delay: delay,
                users: ['@all'],
                colored: type === 'tag_color',
                task_name: `${type === 'tag_color' ? 'Nhây Màu' : 'Nhây Thường'} - ${group.name.slice(0, 20)}`
            };
        }

        const result = await apiCall(endpoint, 'POST', payload);
        log(`✅ Đã khởi động task #${result.task_id} → ${group.name}`, 'success');
        setStatus('taskStatus', `✅ Task #${result.task_id} đang chạy!`, 'success');

        refreshTasks();
    } catch (err) {
        log(`❌ Lỗi khởi động task: ${err.message}`, 'error');
        setStatus('taskStatus', `❌ ${err.message}`, 'error');
    }
}

// ==================== TASKS ====================
async function refreshTasks() {
    try {
        const res = await apiCall('/api/tasks');
        const list = document.getElementById('taskList');
        const count = document.getElementById('taskCount');

        const running = res.tasks.filter(t => t.status === 'running');
        count.textContent = running.length;

        if (res.tasks.length === 0) {
            list.innerHTML = '<div class="info">Chưa có task nào đang chạy.</div>';
            return;
        }

        list.innerHTML = '';
        res.tasks.forEach(t => {
            const div = document.createElement('div');
            div.className = 'task-item';
            const statusCls = t.status === 'running' ? 'status-running' : 'status-stopped';
            div.innerHTML = `
                <div class="task-info">
                    <div class="task-name">#${t.id} — ${t.name}</div>
                    <div class="task-meta">${t.type} • ${t.group} • Bắt đầu: ${t.started}</div>
                </div>
                <span class="status ${statusCls}">${t.status === 'running' ? '🟢 Running' : '🔴 Stopped'}</span>
                <button class="btn btn-danger" onclick="stopTask(${t.id})" style="margin-left: 10px; padding: 6px 12px; font-size: 0.85em;">⛔</button>
            `;
            list.appendChild(div);
        });
    } catch (err) {
        log(`❌ Lỗi lấy tasks: ${err.message}`, 'error');
    }
}

async function stopTask(tid) {
    try {
        await apiCall(`/api/tasks/${tid}`, 'DELETE');
        log(`⛔ Đã dừng task #${tid}`, 'warning');
        refreshTasks();
    } catch (err) {
        log(`❌ Lỗi dừng task: ${err.message}`, 'error');
    }
}

async function stopAllTasks() {
    if (!confirm('Dừng TẤT CẢ task đang chạy?')) return;
    try {
        await apiCall('/api/tasks/all', 'DELETE');
        log('⛔ Đã dừng tất cả tasks', 'warning');
        refreshTasks();
    } catch (err) {
        log(`❌ Lỗi: ${err.message}`, 'error');
    }
}

// ==================== INIT ====================
log('🚀 HDanh Web Panel đã sẵn sàng!', 'success');
log('💡 Nhập IMEI và Cookie để bắt đầu.', 'info');
refreshTasks();
setInterval(refreshTasks, 5000); // Auto refresh 5s

// Hiện/ẩn options theo loại
document.getElementById('actionType').addEventListener('change', e => {
    const isTreongon = e.target.value === 'treongon';
    document.getElementById('extraOptions').style.display = isTreongon ? 'grid' : 'none';
    document.getElementById('tagTarget').parentElement.style.display = isTreongon ? 'none' : 'block';
});

// Ẩn mặc định (Treo Ngôn)
document.getElementById('tagTarget').parentElement.style.display = 'none';
</script>
</body>
</html>
